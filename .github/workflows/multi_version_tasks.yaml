# Workflow to analyze and test all packages against a matrix of Dart versions.
#
# To run locally:
#     gh act pull_request
name: Multi-Version Dart Tasks

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    analyze:
        name: Analyze Dart ${{ matrix.dart-sdk }}
        
        # This creates a separate job for every version in the list
        strategy:
            matrix:
                dart-sdk: [ 3.10.7, 3.11.5, main ]
            fail-fast: false # Continues other versions even if one fails

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Dart (${{ matrix.dart-sdk }})
              uses: dart-lang/setup-dart@v1
              with:
                  sdk: ${{ matrix.dart-sdk }}

            - name: Set up repo tooling
              run: |
                  # This should always use a pinned version to avoid out-of-band breakage.
                  dart pub global activate flutter_plugin_tools 0.14.1

            - name: Run analyze
              run: |
                  dart pub global run flutter_plugin_tools analyze

            - name: Run Dart unit tests
              run: |
                  dart pub global run flutter_plugin_tools test

# Workflow to run repo best practice validations.
#
# To run locally:
#     gh act pull_request
name: Validate Repository

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    analyze:
        name: validate

        runs-on: ubuntu-latest

        steps:
            - name: Set up repository and tooling
              uses: ./.github/actions/set-up-repo
              with:
                  dart-sdk: main

            - name: Validate repository
              run: |
                  dart pub global run flutter_plugin_tools validate
